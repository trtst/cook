services:
  postgres:
    image: postgres:15-alpine
    container_name: next-meal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: next_meal
      POSTGRES_PASSWORD: next_meal
      POSTGRES_DB: next_meal
    ports:
      - "5432:5432"
    volumes:
      - next_meal_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U next_meal -d next_meal"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  next_meal_postgres_data:
